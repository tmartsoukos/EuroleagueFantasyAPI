# Ρυθμίσεις του project: packaging (src layout), pytest και ruff.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elfantasy"
version = "0.1.0"
description = "Euroleague Fantasy Points Predictor API: πρόβλεψη fantasy score παικτών Euroleague"
readme = "README.md"
requires-python = ">=3.11"
# Οι εξαρτήσεις διαβάζονται από το requirements.txt, ώστε να υπάρχει μία μόνο πηγή αλήθειας.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

# Τα migrations (αρχεία SQL της Φάσης 5) ανήκουν στο πακέτο και ακολουθούν το `pip install`.
[tool.setuptools.package-data]
elfantasy = ["db/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Το "tests" στο pythonpath επιτρέπει import των βοηθητικών modules των tests (synthetic_league,
# feature_reference) από τα αρχεία δοκιμών και το conftest.
pythonpath = ["src", "tests"]
# importlib: επιτρέπει αρχεία δοκιμών με το ίδιο όνομα σε διαφορετικούς φακέλους (unit/integration).
addopts = "-ra --import-mode=importlib"
markers = [
    # Τα tests αυτά τρέχουν σε πραγματικό ΤΟΠΙΚΟ Postgres (TEST_DATABASE_URL ή pixeltable-pgserver)
    # και παραλείπονται αν δεν υπάρχει. Εξαίρεση από το τρέξιμο: `pytest -m "not postgres"`.
    "postgres: needs a real local PostgreSQL server (TEST_DATABASE_URL or pixeltable-pgserver)",
]
filterwarnings = [
    # Το Starlette 1.7 θεωρεί παρωχημένο το `httpx` στο TestClient και προτείνει το `httpx2`. Το
    # project χρησιμοποιεί ακόμη το `httpx` (requirements-dev.txt)· η προειδοποίηση αγνοείται
    # μόνο για αυτή τη συγκεκριμένη περίπτωση, ώστε να μη θάβει άλλες προειδοποιήσεις.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: ταξινόμηση imports, B: bugbear, UP: σύγχρονη σύνταξη Python.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Το FastAPI χρησιμοποιεί Depends()/Query()/Header() ως προεπιλεγμένες τιμές παραμέτρων (κανόνας B008).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["elfantasy"]
